[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smoke-tests"
version = "0.1.0"
description = "Reproducible research workspace with isolated research projects."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<2",
  "scikit-learn>=1.5,<1.6",
  "xgboost>=2.1,<3",
  "shap>=0.46,<1",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "jarvis-tools>=2026.6.12",
  "pyyaml>=6.0,<7",
  "pytest>=8.3,<9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools]
packages = ["common"]

[tool.setuptools.package-dir]
common = "src/common"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["projects/mace-md-test/tests"]
markers = [
  "slow: full end-to-end reproduction test",
  "shap: SHAP explanation tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# These scripts intentionally run code before their imports (warning filters /
# torch.set_default_dtype must take effect before torch-based libraries load).
# Reordering would change runtime behaviour, so E402 is silenced instead.
"projects/defect_comparison/scripts/analysis/diagnosis_new.py" = ["E402"]
"projects/defect_comparison/scripts/legacy/*.py" = ["E402"]
